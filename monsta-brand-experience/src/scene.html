<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Monsta Brand Experience</title>
<style>
  @font-face { font-family: "Anton"; src: url("../assets/fonts/Anton.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; src: url("../assets/fonts/Montserrat.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #0b1730; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Monsta Brand Experience — 1920x1080 motion graphic.
// render(t) draws the frame at video time t (seconds). All cue times below are
// in video time; the voiceover starts at t = 1.0s.
const W = 1920, H = 1080, DURATION = 27;
const RED = '#e11d26', RED_DK = '#8e0b12', RED_DEEP = '#4a0509', INK = '#0b1730', CARD = '#13244a', NAVY_DEEP = '#050c1c';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- timing (voiceover cues, video time) ----------
const CUE = {
  brand: 1.0, moreThan: 1.55, logo: 2.15, strike: 2.6,
  itsTheWay: 3.25, see: 4.05, remember: 4.64, experience: 5.37, business: 5.9,
  wipe: 6.75,
  monsta: 8.07, bold: 9.4, custom: 9.99, brands: 10.45, ground: 10.93,
  pan: 12.45, bring: 13.0,
  vehicles: 14.25, print: 15.03, digital: 15.68, beyond: 16.37,
  connected: 17.54, unmistakably: 18.73, yours: 19.75,
  final: 20.63, brandExp: 21.3, voEnd: 22.2, tagline: 22.9,
  fadeOut: 25.6,
};

// ---------- helpers ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, start, dur) => cl((t - start) / dur);
const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function setFont(font, size, weight) { ctx.font = `${weight || (font === 'Anton' ? 400 : 900)} ${size}px "${font}"`; }
function text(s, x, y, o = {}) {
  const { font = 'Anton', size = 100, weight, color = '#fff', align = 'center', alpha = 1, ls = 0, scale = 1, rot = 0, glow = 0, glowColor = RED } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  setFont(font, size, weight);
  ctx.letterSpacing = ls + 'px';
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = glowColor; ctx.shadowBlur = glow; }
  ctx.fillStyle = color;
  // letterSpacing adds trailing space; nudge centered text back
  ctx.fillText(s, align === 'center' ? ls / 2 : 0, 0);
  ctx.restore();
}
function measure(s, font, size, ls = 0, weight) { ctx.save(); setFont(font, size, weight); ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
// Text that slides up out of a clipping mask.
function reveal(s, x, y, prog, o = {}) {
  if (prog <= 0) return;
  const size = o.size || 100;
  const w = measure(s, o.font || 'Anton', size, o.ls || 0, o.weight) + 40;
  const left = o.align === 'left' ? x - 20 : x - w / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(left, y - size * 0.75, w, size * 1.5); ctx.clip();
  text(s, x, y + (1 - eOut(prog)) * size * 1.3, o);
  ctx.restore();
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// camera shake from impacts
const IMPACTS = [[1.0, 14], [8.1, 22], [9.4, 7], [9.99, 7], [10.45, 7], [20.66, 20], [22.2, 10]];
function shake(t) {
  let x = 0, y = 0;
  for (const [ti, amp] of IMPACTS) {
    const d = t - ti - 0.12;
    if (d < 0 || d > 0.6) continue;
    const a = amp * Math.exp(-d * 9);
    x += a * Math.sin(d * 70); y += a * Math.cos(d * 55);
  }
  return [x, y];
}

// ---------- assets ----------
const logo = new Image();
logo.src = '../assets/monsta-logo@2x.png';
const LOGO_AR = 242 / 800;
function drawLogo(cx, cy, w, alpha = 1, glow = 0) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  if (glow) { ctx.shadowColor = 'rgba(225,29,38,0.85)'; ctx.shadowBlur = glow; }
  ctx.drawImage(logo, cx - w / 2, cy - w * LOGO_AR / 2, w, w * LOGO_AR);
  ctx.restore();
}

// particles
const PARTS = (() => { const r = rng(7); return Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, v: 20 + r() * 70, s: 1 + r() * 3.5, a: 0.15 + r() * 0.5, red: r() < 0.55, ph: r() * 6.28 })); })();
const BURST = (() => { const r = rng(11); return Array.from({ length: 140 }, () => ({ ang: r() * Math.PI * 2, sp: 250 + r() * 900, s: 2 + r() * 5, red: r() < 0.7 })); })();
const BARS = (() => { const r = rng(3); return Array.from({ length: 24 }, (_, i) => ({ h: 110 + r() * 230, shade: r() })); })();

// ---------- background ----------
function background(t) {
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  // drifting diagonal stripes
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.028)'; ctx.lineWidth = 2;
  const off = (t * 40) % 60;
  for (let i = -40; i < 80; i++) { const x = i * 60 + off; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x - 620, H); ctx.stroke(); }
  ctx.restore();
  // red glow
  const pulse = 0.22 + 0.06 * Math.sin(t * 2.2) + (t > CUE.voEnd ? 0.18 * eOut(P(t, CUE.voEnd, 0.6)) : 0);
  const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 1000);
  g.addColorStop(0, `rgba(170,14,22,${pulse})`); g.addColorStop(0.55, 'rgba(90,5,10,0.08)'); g.addColorStop(1, 'rgba(11,23,48,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // particles
  for (const p of PARTS) {
    const y = ((p.y - t * p.v) % H + H) % H;
    const x = p.x + Math.sin(t * 0.8 + p.ph) * 20;
    ctx.globalAlpha = p.a * (0.6 + 0.4 * Math.sin(t * 3 + p.ph));
    ctx.fillStyle = p.red ? RED : '#fff';
    ctx.beginPath(); ctx.arc(x, y, p.s, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250);
  g.addColorStop(0, 'rgba(5,12,28,0)'); g.addColorStop(1, 'rgba(5,12,28,0.75)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// Angled full-screen slash bar, x = leading edge position.
function slash(x, w, color, skew = 380) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + w, 0); ctx.lineTo(x + w - skew, H); ctx.lineTo(x - skew, H); ctx.closePath(); ctx.fill();
}

// ---------- icons (drawn centered at 0,0, ~240px wide) ----------
function iconEye(t, k) {
  const open = 0.25 + 0.75 * eOut(k);
  ctx.save(); ctx.scale(1, open);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-80, 0); ctx.quadraticCurveTo(0, -78, 80, 0); ctx.quadraticCurveTo(0, 78, -80, 0); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.moveTo(-80, 0); ctx.quadraticCurveTo(0, -78 * open, 80, 0); ctx.quadraticCurveTo(0, 78 * open, -80, 0); ctx.clip();
  const lx = Math.sin(t * 2) * 10;
  ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(lx, 0, 30, 0, 7); ctx.fill();
  ctx.fillStyle = NAVY_DEEP; ctx.beginPath(); ctx.arc(lx, 0, 14, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(lx + 9, -9, 6, 0, 7); ctx.fill();
  ctx.restore();
}
function iconBulb(t, k) {
  // light rays
  ctx.save(); ctx.strokeStyle = RED; ctx.lineWidth = 8; ctx.lineCap = 'round';
  const r = eOut(P(k, 0.4, 0.6));
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.42;
    ctx.globalAlpha = r;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 66, -18 + Math.sin(a) * 66); ctx.lineTo(Math.cos(a) * (66 + 22 * r), -18 + Math.sin(a) * (66 + 22 * r)); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, -18, 46, Math.PI * 0.78, Math.PI * 2.22); ctx.lineTo(16, 40); ctx.lineTo(-16, 40); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9a9aa2'; rrect(-20, 46, 40, 10, 4); ctx.fill(); rrect(-16, 60, 32, 10, 4); ctx.fill();
  ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(0, -18, 18, 0, 7); ctx.fill();
}
function star(cx, cy, r, inner = 0.28) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2; const rr = i % 2 ? r * inner : r; ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  ctx.closePath();
}
function iconSparkle(t, k) {
  ctx.save(); ctx.rotate(Math.sin(t * 1.5) * 0.12);
  ctx.fillStyle = RED; star(0, 0, 72 * eBack(k)); ctx.fill();
  ctx.fillStyle = '#fff'; star(58, -46, 24 * eBack(P(k, .3, .7))); ctx.fill();
  star(-56, 44, 18 * eBack(P(k, .45, .55))); ctx.fill();
  ctx.restore();
}
function iconVan(t, k) {
  const dx = (1 - eOut(k)) * -160;
  ctx.save(); ctx.translate(dx, 0);
  // speed lines
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) { const y = -30 + i * 26, l = 30 + 30 * Math.sin(t * 9 + i); ctx.beginPath(); ctx.moveTo(-150 - l, y); ctx.lineTo(-135, y); ctx.stroke(); }
  // body
  ctx.fillStyle = '#f2f2f4';
  ctx.beginPath(); ctx.moveTo(-120, 40); ctx.lineTo(-120, -55); ctx.quadraticCurveTo(-120, -64, -110, -64); ctx.lineTo(50, -64);
  ctx.quadraticCurveTo(66, -64, 76, -48); ctx.lineTo(108, -6); ctx.quadraticCurveTo(118, 4, 118, 18); ctx.lineTo(118, 40); ctx.closePath(); ctx.fill();
  // windshield
  ctx.fillStyle = '#0f1d3d';
  ctx.beginPath(); ctx.moveTo(56, -54); ctx.lineTo(70, -54); ctx.lineTo(100, -12); ctx.lineTo(56, -12); ctx.closePath(); ctx.fill();
  // red wrap swoosh
  ctx.save(); ctx.beginPath(); ctx.moveTo(-120, 40); ctx.lineTo(-120, -55); ctx.lineTo(50, -64); ctx.lineTo(118, 18); ctx.lineTo(118, 40); ctx.closePath(); ctx.clip();
  ctx.fillStyle = RED;
  ctx.beginPath(); ctx.moveTo(-130, 10); ctx.bezierCurveTo(-60, -40, 10, 40, 130, -20); ctx.lineTo(130, 45); ctx.lineTo(-130, 45); ctx.closePath(); ctx.fill();
  ctx.fillStyle = RED_DK;
  ctx.beginPath(); ctx.moveTo(-130, 30); ctx.bezierCurveTo(-60, -10, 10, 60, 130, 10); ctx.lineTo(130, 45); ctx.lineTo(-130, 45); ctx.closePath(); ctx.fill();
  ctx.restore();
  text('M', -50, -32, { size: 40, color: RED });
  // wheels
  for (const wx of [-72, 72]) {
    ctx.fillStyle = NAVY_DEEP; ctx.beginPath(); ctx.arc(wx, 42, 24, 0, 7); ctx.fill();
    ctx.fillStyle = '#8b8b93'; ctx.beginPath(); ctx.arc(wx, 42, 10, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function iconPrint(t, k) {
  // flyer
  ctx.save(); ctx.rotate(lerp(0, -0.16, eOut(k))); ctx.translate(-34, -6);
  ctx.fillStyle = '#f2f2f4'; rrect(-62, -84, 124, 168, 6); ctx.fill();
  ctx.fillStyle = RED; rrect(-62, -84, 124, 52, [6, 6, 0, 0]); ctx.fill();
  ctx.fillStyle = '#c4c4cc'; for (let i = 0; i < 4; i++) { rrect(-44, -14 + i * 22, i === 3 ? 50 : 88, 8, 4); ctx.fill(); }
  ctx.restore();
  // business card
  ctx.save(); ctx.translate(lerp(20, 46, eOut(k)), lerp(40, 34, eOut(k))); ctx.rotate(lerp(0, 0.12, eOut(k)));
  ctx.fillStyle = '#0f1d3d'; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
  rrect(-80, -46, 160, 92, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = RED; ctx.fillRect(-80, 24, 160, 10);
  text('MONSTA', -10, -12, { size: 30, color: '#fff', align: 'center' });
  ctx.restore();
}
function iconDigital(t, k) {
  // monitor
  ctx.fillStyle = '#22355e'; rrect(-110, -78, 190, 124, 10); ctx.fill();
  const g = ctx.createLinearGradient(-100, -70, 70, 40); g.addColorStop(0, RED); g.addColorStop(1, RED_DEEP);
  ctx.fillStyle = g; rrect(-100, -68, 170, 104, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const bw = 120 * eOut(P(k, .2, .6));
  rrect(-84, -52, bw, 14, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; rrect(-84, -28, bw * 0.7, 10, 5); ctx.fill(); rrect(-84, -12, bw * 0.55, 10, 5); ctx.fill();
  ctx.fillStyle = '#22355e'; ctx.fillRect(-25, 46, 20, 22); rrect(-55, 66, 80, 10, 5); ctx.fill();
  // phone
  const py = lerp(60, 0, eBack(P(k, .15, .6)));
  ctx.save(); ctx.translate(86, 18 + py);
  ctx.fillStyle = '#f2f2f4'; rrect(-34, -62, 68, 124, 12); ctx.fill();
  ctx.fillStyle = '#0f1d3d'; rrect(-28, -52, 56, 100, 6); ctx.fill();
  ctx.fillStyle = RED; rrect(-22, -44, 44, 30, 4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; rrect(-22, -6, 44, 7, 3); ctx.fill(); rrect(-22, 6, 30, 7, 3); ctx.fill();
  ctx.restore();
}
function iconBeyond(t, k) {
  // orbit
  ctx.save(); ctx.rotate(-0.35);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(0, 0, 112 * eOut(k), 40 * eOut(k), 0, 0, 7); ctx.stroke();
  const a = t * 2.6;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(Math.cos(a) * 112, Math.sin(a) * 40, 9 * eOut(k), 0, 7); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.rotate(t * 0.6);
  ctx.fillStyle = RED; star(0, 0, 66 * eBack(k), 0.3); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff'; star(78, -60, 16 * eBack(P(k, .35, .6))); ctx.fill();
  star(-84, 56, 12 * eBack(P(k, .5, .5))); ctx.fill();
}

// ---------- scenes ----------
function sceneIntro(t) {
  if (t > 1.4) return;
  const bars = [[0.0, 520, RED_DK], [0.1, 380, RED], [0.22, 160, '#fff']];
  for (const [d, w, c] of bars) {
    const x = lerp(-w - 400, W + 450, eIO(P(t, d, 1.0)));
    slash(x, w, c);
  }
}

function sceneA(t) {
  if (t < CUE.brand || t > 3.45) return;
  const ex = eIn(P(t, 3.0, 0.4));
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(1 + ex * 0.8, 1 + ex * 0.8); ctx.translate(-W / 2, -H / 2);
  ctx.globalAlpha = 1 - ex;
  const k = P(t, CUE.brand, 0.3);
  text('YOUR BRAND', W / 2, 360, { size: 230, scale: lerp(2.2, 1, eOut(k)), alpha: cl(k * 5), ls: 4, glow: 30 * (1 - k) + 10, glowColor: 'rgba(225,29,38,0.6)' });
  reveal('IS MORE THAN JUST A', W / 2, 545, P(t, CUE.moreThan, 0.45), { font: 'Montserrat', size: 58, ls: 10, color: '#c9c9cf' });
  // "LOGO." in an outlined badge that gets struck through
  const kl = P(t, CUE.logo, 0.4);
  if (kl > 0) {
    const s = eBack(kl);
    ctx.save(); ctx.translate(W / 2, 735); ctx.scale(s, s);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 6; ctx.setLineDash([22, 14]);
    rrect(-250, -105, 500, 210, 26); ctx.stroke(); ctx.setLineDash([]);
    text('LOGO.', 0, 4, { size: 170, color: RED, ls: 6 });
    const ks = eOut(P(t, CUE.strike, 0.25));
    if (ks > 0) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 16; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-290, 40); ctx.lineTo(lerp(-290, 290, ks), lerp(40, -40, ks)); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

function sceneB(t) {
  if (t < 3.1 || t > 7.25) return;
  const enter = eOut(P(t, 3.05, 0.5));
  ctx.save(); ctx.globalAlpha = enter;
  reveal("IT'S THE WAY PEOPLE", W / 2, 205, P(t, CUE.itsTheWay, 0.5), { font: 'Montserrat', size: 52, ls: 14, color: '#c9c9cf' });
  const cols = [[420, CUE.see, 'SEE', iconEye], [960, CUE.remember, 'REMEMBER', iconBulb], [1500, CUE.experience, 'EXPERIENCE', iconSparkle]];
  for (const [x, c, word, icon] of cols) {
    const k = P(t, c, 0.5);
    if (k <= 0) continue;
    const active = t < c + 0.9 ? 1 - P(t, c + 0.5, 0.4) : 0;
    ctx.save(); ctx.translate(x, 470); ctx.scale(eBack(k), eBack(k));
    ctx.fillStyle = CARD; ctx.beginPath(); ctx.arc(0, 0, 135, 0, 7); ctx.fill();
    ctx.save(); ctx.shadowColor = RED; ctx.shadowBlur = 20 + 40 * active;
    ctx.strokeStyle = RED; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(0, 0, 135, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eOut(P(t, c, 0.6))); ctx.stroke();
    ctx.restore();
    icon(t, P(t, c + 0.05, 0.6));
    ctx.restore();
    reveal(word, x, 700, P(t, c + 0.08, 0.4), { size: 96, ls: 3 });
  }
  const kb = P(t, CUE.business, 0.45);
  reveal('YOUR BUSINESS.', W / 2, 875, kb, { font: 'Montserrat', size: 66, ls: 8 });
  if (kb > 0) { const w = 640 * eOut(P(t, CUE.business + 0.2, 0.5)); ctx.fillStyle = RED; ctx.fillRect(W / 2 - w / 2, 925, w, 10); }
  ctx.restore();
}

// red panel wipe between B and C
function wipeBC(t) {
  const k1 = P(t, CUE.wipe, 0.5), k2 = P(t, CUE.wipe + 0.55, 0.6);
  if (k1 <= 0 || k2 >= 1) return;
  const w = W + 900;
  const x = lerp(W + 400, -250, eIO(k1)) + lerp(0, -w - 500, eIn(k2));
  slash(x - 120, 140, '#fff');
  slash(x, w, RED);
  slash(x + 60, w, RED_DK);
}

function sceneC(t) {
  if (t < 7.2 || t > 13.2) return;
  const pan = eIO(P(t, CUE.pan, 0.65));
  ctx.save(); ctx.translate(0, -pan * 1150);
  // logo slam, then move up
  const k = P(t, CUE.monsta, 0.28);
  const up = eIO(P(t, 9.15, 0.5));
  if (k > 0) {
    // impact ring
    const kr = P(t, CUE.monsta + 0.2, 0.7);
    if (kr > 0 && kr < 1) { ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${0.7 * (1 - kr)})`; ctx.lineWidth = 10 * (1 - kr) + 1; ctx.beginPath(); ctx.ellipse(W / 2, 480, 300 + 900 * eOut(kr), 120 + 360 * eOut(kr), 0, 0, 7); ctx.stroke(); ctx.restore(); }
    const w = lerp(1000, 560, up) * lerp(2.6, 1, eOut(k));
    drawLogo(W / 2, lerp(480, 205, up), w, cl(k * 6), 40);
  }
  reveal('AT', W / 2, 480, P(t, 7.5, 0.3) * (1 - P(t, CUE.monsta - 0.05, 0.05)), { font: 'Montserrat', size: 60, ls: 20, color: '#c9c9cf' });
  // BOLD. CUSTOM. BRANDS.
  const words = [['BOLD.', CUE.bold, '#fff'], ['CUSTOM.', CUE.custom, RED], ['BRANDS.', CUE.brands, '#fff']];
  const size = 180, gap = 50;
  const ws = words.map(w => measure(w[0], 'Anton', size, 2));
  let x = W / 2 - (ws.reduce((a, b) => a + b, 0) + gap * 2) / 2;
  words.forEach(([s, c, col], i) => {
    const kk = P(t, c, 0.35);
    if (kk > 0) text(s, x + ws[i] / 2, 515 + (1 - eBack(kk)) * -90, { size, color: col, alpha: cl(kk * 4), ls: 2, scale: lerp(1.4, 1, eOut(kk)) });
    x += ws[i] + gap;
  });
  reveal('FROM THE GROUND UP', W / 2, 705, P(t, CUE.ground, 0.45), { font: 'Montserrat', size: 56, ls: 18, color: '#c9c9cf' });
  // rising blocks
  const bw = W / BARS.length;
  BARS.forEach((b, i) => {
    const d = Math.abs(i - (BARS.length - 1) / 2) / (BARS.length / 2);
    const kk = eBack(P(t, CUE.ground + 0.05 + d * 0.45, 0.55));
    if (kk <= 0) return;
    const h = b.h * kk;
    const col = b.shade < 0.33 ? RED : b.shade < 0.66 ? RED_DK : '#5c070d';
    ctx.fillStyle = col; ctx.fillRect(i * bw + 3, H - h, bw - 6, h + 400);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(i * bw + 3, H - h, bw - 6, 6);
  });
  ctx.restore();
}

const CARDS = [
  ['VEHICLES', CUE.vehicles, iconVan],
  ['PRINT', CUE.print, iconPrint],
  ['DIGITAL', CUE.digital, iconDigital],
  ['& BEYOND', CUE.beyond, iconBeyond],
];
const CARD_W = 370, CARD_H = 450;
function cardHome(i) { return [165 + CARD_W / 2 + i * (CARD_W + 50), 625]; }
const NET = [[470, 300], [1450, 300], [470, 680], [1450, 680]];
const HUB = [W / 2, 490];

function sceneDEF(t) {
  if (t < CUE.pan) return;
  const panIn = (1 - eIO(P(t, CUE.pan, 0.65))) * 1150;
  ctx.save(); ctx.translate(0, panIn);
  const toNet = eIO(P(t, CUE.connected - 0.05, 0.7));
  const collapse = eIn(P(t, CUE.final - 0.3, 0.3));
  // header
  const hk = P(t, CUE.bring, 0.5);
  const hOut = 1 - toNet;
  if (hOut > 0) {
    ctx.save(); ctx.globalAlpha = hOut;
    const wL = measure('BRING IT TO ', 'Anton', 130, 4), wR = measure('LIFE', 'Anton', 130, 4);
    const left = W / 2 - (wL + wR) / 2;
    reveal('BRING IT TO ', left, 200, hk, { size: 130, ls: 4, align: 'left' });
    reveal('LIFE', left + wL, 200, P(t, CUE.bring + 0.25, 0.5), { size: 130, ls: 4, align: 'left', color: RED });
    ctx.restore();
  }
  // network lines (behind cards)
  if (toNet > 0 && collapse < 1) {
    const lk = eOut(P(t, CUE.connected + 0.35, 0.6)) * (1 - collapse);
    ctx.save();
    ctx.strokeStyle = RED; ctx.lineWidth = 6; ctx.shadowColor = RED; ctx.shadowBlur = 18;
    for (const [nx, ny] of NET) {
      ctx.beginPath(); ctx.moveTo(HUB[0], HUB[1]); ctx.lineTo(lerp(HUB[0], nx, lk), lerp(HUB[1], ny, lk)); ctx.stroke();
    }
    // ring links between neighbours
    const order = [0, 1, 3, 2, 0];
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3; ctx.shadowBlur = 0; ctx.setLineDash([14, 12]); ctx.lineDashOffset = -t * 60;
    const rk = eOut(P(t, CUE.connected + 0.6, 0.6)) * (1 - collapse);
    for (let i = 0; i < 4; i++) {
      const [ax, ay] = NET[order[i]], [bx, by] = NET[order[i + 1]];
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(lerp(ax, bx, rk), lerp(ay, by, rk)); ctx.stroke();
    }
    ctx.setLineDash([]);
    // travelling pulses
    if (lk >= 1) {
      ctx.fillStyle = '#fff';
      NET.forEach(([nx, ny], i) => { const f = ((t * 0.9 + i * 0.25) % 1); ctx.beginPath(); ctx.arc(lerp(nx, HUB[0], f), lerp(ny, HUB[1], f), 7, 0, 7); ctx.fill(); });
    }
    ctx.restore();
    // hub
    const hs = eBack(P(t, CUE.connected + 0.2, 0.5)) * (1 - collapse);
    if (hs > 0) {
      ctx.save(); ctx.translate(HUB[0], HUB[1]); ctx.scale(hs, hs);
      ctx.fillStyle = CARD; ctx.strokeStyle = RED; ctx.lineWidth = 6; ctx.shadowColor = RED; ctx.shadowBlur = 30 + 15 * Math.sin(t * 6);
      rrect(-250, -95, 500, 190, 95); ctx.fill(); ctx.stroke();
      ctx.restore();
      drawLogo(HUB[0], HUB[1], 420 * hs, 1);
    }
  }
  // cards
  CARDS.forEach(([label, c, icon], i) => {
    const k = P(t, c, 0.5);
    if (k <= 0 || collapse >= 1) return;
    const [hx, hy] = cardHome(i);
    const [nx, ny] = NET[i];
    let x = lerp(hx, nx, toNet), y = lerp(hy, ny, toNet);
    let s = lerp(1, 0.56, toNet);
    x = lerp(x, HUB[0], collapse); y = lerp(y, HUB[1], collapse); s *= 1 - collapse;
    y += (1 - eBack(k)) * 320;
    const active = toNet > 0 ? 0 : (CARDS[i + 1] ? 1 - P(t, CARDS[i + 1][1], 0.3) : 1 - P(t, c + 0.9, 0.4));
    ctx.save(); ctx.globalAlpha = cl(k * 3); ctx.translate(x, y); ctx.scale(s, s);
    ctx.save(); ctx.shadowColor = RED; ctx.shadowBlur = 12 + 50 * active;
    ctx.fillStyle = CARD; rrect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 26); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = active > 0.05 ? `rgba(225,29,38,${0.4 + 0.6 * active})` : 'rgba(255,255,255,0.12)'; ctx.lineWidth = 4;
    rrect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 26); ctx.stroke();
    ctx.fillStyle = RED; rrect(-CARD_W / 2, -CARD_H / 2, CARD_W, 12, [26, 26, 0, 0]); ctx.fill();
    ctx.save(); ctx.translate(0, -50); icon(t, P(t, c + 0.1, 0.7)); ctx.restore();
    text(label, 0, 150, { size: 72, ls: 3 });
    ctx.restore();
  });
  // E: words
  if (toNet > 0) {
    const fade = 1 - collapse;
    ctx.save(); ctx.globalAlpha = fade;
    reveal('EVERYTHING CONNECTED.', W / 2, 95, P(t, CUE.connected, 0.5), { font: 'Montserrat', size: 60, ls: 12 });
    reveal('EVERYTHING UNMISTAKABLY', W / 2, 905, P(t, CUE.unmistakably, 0.5), { font: 'Montserrat', size: 46, ls: 12, color: '#c9c9cf' });
    const ky = P(t, CUE.yours, 0.35);
    if (ky > 0) text('YOURS.', W / 2, 1000, { size: 120, ls: 8, color: RED, scale: lerp(1.6, 1, eOut(ky)), alpha: cl(ky * 4), glow: 25 });
    ctx.restore();
  }
  ctx.restore();
}

function sceneFinal(t) {
  if (t < CUE.final - 0.05) return;
  const k = P(t, CUE.final, 0.3);
  const swell = eOut(P(t, CUE.voEnd, 0.8));
  // light rays behind logo
  if (swell > 0) {
    ctx.save(); ctx.translate(W / 2, 470); ctx.rotate(t * 0.25);
    for (let i = 0; i < 16; i++) {
      ctx.rotate(Math.PI * 2 / 16);
      const g = ctx.createLinearGradient(0, 0, 1100, 0);
      g.addColorStop(0, `rgba(225,29,38,${0.32 * swell})`); g.addColorStop(1, 'rgba(225,29,38,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1100, -70); ctx.lineTo(1100, 70); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // particle burst on the music swell
    const bt = t - CUE.voEnd;
    for (const b of BURST) {
      const d = b.sp * (1 - Math.exp(-bt * 1.6));
      ctx.globalAlpha = cl(1 - bt / 4) * 0.9;
      ctx.fillStyle = b.red ? RED : '#fff';
      ctx.beginPath(); ctx.arc(W / 2 + Math.cos(b.ang) * d, 470 + Math.sin(b.ang) * d * 0.7, b.s, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const breathe = 1 + 0.025 * swell * Math.sin((t - CUE.voEnd) * Math.PI * 2 * 0.75);
  drawLogo(W / 2, 470, 1040 * lerp(1.7, 1, eOut(k)) * breathe, cl(k * 5), 30 + 30 * swell);
  // BRAND EXPERIENCE letter by letter
  const s = 'BRAND EXPERIENCE', size = 118, ls = 22;
  const total = measure(s, 'Anton', size, ls);
  let x = W / 2 - total / 2 + ls / 2;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i]; const cw = measure(ch, 'Anton', size, ls);
    const kk = P(t, CUE.brandExp + i * 0.035, 0.35);
    if (kk > 0) text(ch, x + cw / 2, 745 + (1 - eOut(kk)) * 60, { size, ls, alpha: kk, color: i >= 6 ? '#fff' : RED });
    x += cw;
  }
  const lw = 900 * eOut(P(t, CUE.brandExp + 0.5, 0.6));
  if (lw > 0) { ctx.fillStyle = RED; ctx.fillRect(W / 2 - lw / 2, 822, lw, 8); }
  reveal('EVERYTHING CONNECTED.  EVERYTHING YOURS.', W / 2, 895, P(t, CUE.tagline, 0.6), { font: 'Montserrat', size: 34, weight: 700, ls: 10, color: '#b9b9c0' });
}

function flash(t) {
  for (const [ti, a] of [[CUE.final, 0.85], [CUE.monsta + 0.05, 0.35]]) {
    const k = P(t, ti, 0.35);
    if (k > 0 && k < 1) { ctx.fillStyle = `rgba(255,255,255,${a * (1 - k)})`; ctx.fillRect(0, 0, W, H); }
  }
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  background(t);
  const [sx, sy] = shake(t);
  ctx.save(); ctx.translate(sx, sy);
  sceneA(t);
  sceneB(t);
  sceneC(t);
  sceneDEF(t);
  sceneFinal(t);
  ctx.restore();
  wipeBC(t);
  sceneIntro(t);
  flash(t);
  vignette();
  const fo = P(t, CUE.fadeOut, DURATION - CUE.fadeOut);
  if (fo > 0) { ctx.fillStyle = `rgba(5,12,28,${eIn(fo) * 0.3 + fo * 0.7})`; ctx.fillRect(0, 0, W, H); }
}

window.DURATION = DURATION;
window.ready = Promise.all([
  document.fonts.load('400 100px "Anton"'),
  document.fonts.load('900 100px "Montserrat"'),
  document.fonts.load('700 100px "Montserrat"'),
  new Promise(r => logo.complete ? r() : (logo.onload = r)),
]).then(() => { render(0); return true; });
// preview: open in a browser with #play to watch it loop
if (location.hash === '#play') { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
</script>
</body>
</html>
